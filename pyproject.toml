[project]
name = "prss"
version = "0.1.0"
description = "Pathology report and slide search on public data"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "requests"]

[project.optional-dependencies]
dev = ["pytest"]
# Track 2. torch: if pip picks a CPU-only build, install it first from https://pytorch.org
slides = ["torch", "timm>=1.0", "huggingface_hub", "pillow", "openslide-python", "openslide-bin"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
